<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review with rating, installation date, and feature feedback.">
    <meta name="author" content="Isaac Bolili Bakambala">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <title>Product Review | WDD 131</title>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="review-form">
            <p class="required-note"><span class="req" aria-hidden="true">*</span> Indicates a required field</p>

            <div class="form-group">
                <label for="productName">Product Name <span class="req" aria-label="Required">*</span></label>
                <select name="productName" id="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating <span class="req" aria-label="required">*</span></legend>
                <div class="rating-grid">
                    <label class="rating-item" for="rating1">
                        <span aria-hidden="true">&star;</span>
                        <input type="radio" id="rating1" name="rating" value="1" aria-label="1 star" required>
                    </label>

                    <label class="rating-item" for="rating2">
                        <span aria-hidden="true">&star; &star;</span>
                        <input type="radio" id="rating2" name="rating" value="2" aria-label="2 stars" required>
                    </label>

                    <label class="rating-item" for="rating3">
                        <span aria-hidden="true">&star; &star; &star;</span>
                        <input type="radio" id="rating3" name="rating" value="3" aria-label="3 stars" required>
                    </label>

                    <label class="rating-item" for="rating4">
                        <span aria-hidden="true">&star; &star; &star; &star;</span>
                        <input type="radio" id="rating4" name="rating" value="4" aria-label="4 stars" required>
                    </label>

                    <label class="rating-item" for="rating5">
                        <span aria-hidden="true">&star; &star; &star; &star; &star;</span>
                        <input type="radio" id="rating5" name="rating" value="5" aria-label="5 stars" required>
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation <span class="req" aria-label="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Which features did you find useful in the product? <span class="optional">(Check all that
                        apply)</span></legend>
                <div class="checkbox-group">
                    <label class="checkbox-item" for="featuresDurability">
                        <input type="checkbox" id="featuresDurability" name="features" value="durability">
                        <span>Durability</span>
                    </label>
                    <label class="checkbox-item" for="featuresEase">
                        <input type="checkbox" id="featuresEase" name="features" value="ease-of-use">
                        <span>Ease of Use</span>
                    </label>
                    <label class="checkbox-item" for="featuresPerformance">
                        <input type="checkbox" id="featuresPerformance" name="features" value="performance">
                        <span>Performance</span>
                    </label>
                    <label class="checkbox-item" for="featuresDesign">
                        <input type="checkbox" id="featuresDesign" name="features" value="design">
                        <span>Design</span>
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea name="writtenReview" id="writtenReview" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </div>

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> | Isaac Bolili Bakambala | Democratic Republic of the Congo</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
